AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  PDE Story 1.1 (re-scoped, orchestrate-and-pull, RD-006) — the tier-1 trust
  fabric. Deploys a least-privilege MEMBER execution role into a member account
  (Pipeline-Dev / Sandbox / Prod). The role is assumable ONLY by a SPECIFIC
  Pipeline-Hub orchestrator role (never the Hub account root), with an ExternalId.
  In the orchestrate-and-pull model the Hub DIRECTS this role and the deployment
  ACTION EXECUTES LOCALLY in the member; the Hub does not push writes into the
  member. Deploy this stack ONCE PER MEMBER (or via a StackSet). Do NOT deploy
  into the Organization management account.

  TIGHT TIER-1 SCOPE: this establishes the trust identity + DIRECTION only. The
  orchestration engine (Step Functions), the results intake data-contract, and the
  Hub-signed decision-token machinery are Phase 2 (RD-006 amendment).

# ---------------------------------------------------------------------------
# PARAMETERS
# ---------------------------------------------------------------------------
Parameters:

  HubAccountId:
    Type: String
    Description: The Pipeline-Hub (shared control plane) account ID (RD-006).
    Default: "641628980935"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Must be a 12-digit AWS account ID.

  HubOrchestratorRoleName:
    Type: String
    Description: >-
      The EXACT name of the Hub-side orchestrator role allowed to assume/direct
      this member execution role. Per RD-006 the member trusts a specific Hub
      ROLE, not the Hub account root. The orchestrator role lives in PDE's pdlv-
      Hub namespace (RD-009): the default is pdlv-hub-orchestrator, matching the
      Story 3.2 Hub orchestrator stack (infra/hub-orchestrator-role.yaml) and the
      Phase-1 gate script (scripts/phase1_gate.py). It is deliberately NOT the
      legacy pde-hub-orchestrator name, which collides with a pre-existing Hub role
      and violates RD-009. The trust may name it before it exists (resolved at
      assume-time); re-deploying this stack repoints the live member trust to it.
    Default: pdlv-hub-orchestrator
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"

  ExternalId:
    Type: String
    Description: >-
      Shared secret required on sts:AssumeRole (confused-deputy protection). The
      Hub orchestrator must present this exact value. Store it in the Hub's config;
      do not commit the real value to source.
    NoEcho: true
    MinLength: 8
    MaxLength: 128

  RolePrefix:
    Type: String
    Description: PDE naming prefix (ZTIE co-existence — avoid collisions).
    Default: pde-
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"

  ArtifactPrefix:
    Type: String
    Description: >-
      ZTIE-safe Hub/pipeline resource prefix for the PDE ARTIFACTS this member role
      deploys locally (RD-009). This is DISTINCT from RolePrefix: the role itself keeps
      the pde- name (it is the Phase-1 trust principal the Hub names), but the deployed
      artifact stacks + their resources use pdlv- (substring-disjoint from ZTIE's pde-*
      so the member's local-execution grants are walled off from the ZTIE namespace).
      The Story 3.1 Golden-Path artifact deploys as a pdlv- stack / pdlv- DynamoDB
      table, so the local CFN + DynamoDB grants below are scoped to exactly pdlv-*.
    Default: pdlv-
    AllowedPattern: "^pdlv-$"
    ConstraintDescription: Must be exactly "pdlv-" (RD-009 — ZTIE-safe artifact prefix).

  EnvironmentName:
    Type: String
    Description: Which member this role is being deployed into (for naming/tagging).
    AllowedValues: [dev, sandbox, prod]

  StoryTag:
    Type: String
    Description: >-
      The id of the story that currently OWNS/redeploys this role, applied as the
      role's `Story` resource tag. This role is a long-lived trust-fabric resource
      first authored under Story 1.1 and redeployed by later stories; the tag marks
      which story last stood it up and is used by scripts/preflight_story_3_2.py as a
      "redeployed from the right branch" freshness signal. It is a PARAMETER (never a
      hardcoded literal) so a redeploy cannot silently carry a stale value. Default is
      the current owning story (3.2); a future story that redeploys this role passes
      its own id.
    Default: "3.2"
    AllowedPattern: "^(G-)?[0-9]+(\\.[0-9]+)?$"
    ConstraintDescription: Must be a story id, e.g. 3.2, 1.1, or G-1.

# ---------------------------------------------------------------------------
# RESOURCES
# ---------------------------------------------------------------------------
Resources:

  # --- Permissions the member's LOCAL execution uses --------------------------
  # In orchestrate-and-pull the ACTION runs locally in this member; these are the
  # permissions that local execution needs to deploy PDE artifacts IN THIS ACCOUNT.
  # Scoped to the pde- stack namespace — NOT AdministratorAccess, NOT a wildcard.
  # NOTE: the full local-execution permission set is finalized in Phase 2 alongside
  # the orchestration engine; tier-1 establishes the identity + trust direction.
  MemberExecutionPermissions:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RolePrefix}member-execution-permissions-${EnvironmentName}"
      Description: Least-privilege permissions for PDE LOCAL (in-member) CFN execution.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # CloudFormation stack lifecycle, scoped to the pdlv- ARTIFACT namespace
          # (RD-009) — NOT the pde- role namespace. The Story 3.1 Golden-Path artifact
          # deploys as a pdlv- stack, so this is what the local deploy actually needs;
          # scoping to pdlv-* walls the member's execution grants off from ZTIE's pde-*
          # stacks in the same account. NOT AdministratorAccess, NOT a wildcard stack.
          - Sid: LocalCloudFormationStackOps
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:ListStackResources
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ValidateTemplate
              - cloudformation:TagResource
              - cloudformation:UntagResource
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${ArtifactPrefix}*/*"
          # The actual resource the Golden-Path artifact creates: an on-demand
          # DynamoDB table. Scoped STRICTLY to pdlv-* table names (RD-009) in this
          # account — these actions can touch ONLY pdlv- tables, never a pde- (ZTIE)
          # table. The action set is the CONCRETE table-lifecycle set CloudFormation
          # needs to create/update/delete + describe/tag the artifact table (NOT a
          # dynamodb:* service wildcard; least privilege, and avoids a checkov
          # action-wildcard finding). No data-plane item actions (the artifact is
          # empty; the pipeline is a correctness probe, not a datastore).
          - Sid: LocalPdlvDynamoDbArtifactOnly
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:UpdateTable
              - dynamodb:DescribeTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateContinuousBackups
              - dynamodb:UpdateTimeToLive
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UntagResource
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/${ArtifactPrefix}*"
              - !Sub "arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/${ArtifactPrefix}*/index/*"
          # Describe/list are account-level reads CloudFormation needs; they expose no
          # mutate power and cannot be ARN-scoped.
          - Sid: ReadOnlyDescribe
            Effect: Allow
            Action:
              - cloudformation:ListStacks
              - cloudformation:ListExports
              - cloudformation:ListImports
            Resource: "*"

  # --- The member execution role the Hub orchestrator DIRECTS -----------------
  MemberExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RolePrefix}member-execution-${EnvironmentName}"
      Description: >-
        PDE member LOCAL execution role. Assumable/directable ONLY by the named
        Pipeline-Hub orchestrator role, with the required ExternalId (RD-006
        orchestrate-and-pull). The Hub directs; execution is local to this member.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TrustSpecificHubOrchestratorRole
            Effect: Allow
            Principal:
              # A SPECIFIC Hub role ARN — not arn:aws:iam::<hub>:root.
              AWS: !Sub "arn:${AWS::Partition}:iam::${HubAccountId}:role/${HubOrchestratorRoleName}"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      ManagedPolicyArns:
        - !Ref MemberExecutionPermissions
      Tags:
        - { Key: Project, Value: PDE }
        - { Key: Story, Value: !Ref StoryTag }
        - { Key: Component, Value: trust-fabric }
        - { Key: Model, Value: orchestrate-and-pull }
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: ManagedBy, Value: cloudformation }

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
Outputs:

  MemberExecutionRoleArn:
    Description: ARN of the PDE member execution role (the Hub orchestrator directs this).
    Value: !GetAtt MemberExecutionRole.Arn
    Export:
      Name: !Sub "pde-member-execution-role-arn-${EnvironmentName}"

  MemberExecutionRoleName:
    Description: Name of the PDE member execution role.
    Value: !Ref MemberExecutionRole

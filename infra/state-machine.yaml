AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  PDE Story 2.2 (Phase 2; RD-003/004/006/009). The Hub-side Step Functions state
  machine that orchestrates the Dev -> Sandbox -> Prod promotion, pausing on a
  native manual-approval state (callback token) before Sandbox and before Prod.
  Each promotion starts the Story 2.1 pdlv-deploy CodeBuild project (.sync), which
  assumes the Story 1.1 member role and deploys locally in the member (RD-006
  orchestrate-and-pull). ZTIE-safe pdlv- prefix + Project=PDE tags (RD-009; pde- is
  ZTIE's). Least privilege: the execution role may only start/describe the specific
  pdlv-deploy project + publish the approval request + write its own logs — no
  wildcard actions, no broad CodeBuild grant, no admin. Author + static proof only;
  the live Hub deploy + the dummy-payload paused-state run are Story 2.3 (the gate).

# ---------------------------------------------------------------------------
# PARAMETERS
# ---------------------------------------------------------------------------
Parameters:

  NamePrefix:
    Type: String
    Description: >-
      PDE Hub-side naming prefix. MUST be pdlv- (RD-009): pde- is ZTIE's namespace
      in Pipeline-Hub (18 existing pde-* stacks), and pdlv- is substring-disjoint
      from pde so it never collides with — nor is swept up by inventory filters that
      match — the ZTIE pde-* namespace.
    Default: pdlv-
    AllowedPattern: "^pdlv-$"
    ConstraintDescription: Must be exactly "pdlv-" (RD-009 — ZTIE-safe prefix).

  DeployProjectName:
    Type: String
    Description: >-
      Name of the Story 2.1 pdlv-deploy CodeBuild project this state machine starts
      per environment. Defaults to the exported value; the state machine holds
      StartBuild on exactly this project's ARN (least privilege), nothing broader.
    Default: pdlv-deploy
    AllowedPattern: "^pdlv-[A-Za-z0-9-]{1,100}$"
    ConstraintDescription: Must be a pdlv--prefixed CodeBuild project name (RD-009).

  MemberRoleName:
    Type: String
    Description: >-
      The EXACT name of the Story 1.1 member execution role the deploy project
      assumes in each member account. These roles live in the MEMBER accounts
      (Dev/Sandbox/Prod), not the Hub, so they keep their pde-member-execution-<env>
      names (RD-009). The <env> suffix is appended per environment below.
    Default: pde-member-execution
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,56}$"

  DevAccountId:
    Type: String
    Description: Pipeline-Dev member account ID.
    Default: "946509368326"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Must be a 12-digit AWS account ID.

  SandboxAccountId:
    Type: String
    Description: Pipeline-Sandbox member account ID.
    Default: "586917955591"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Must be a 12-digit AWS account ID.

  ProdAccountId:
    Type: String
    Description: Pipeline-Prod member account ID.
    Default: "466494951534"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Must be a 12-digit AWS account ID.

  ExternalId:
    Type: String
    Description: >-
      Shared secret the deploy project presents on sts:AssumeRole into the member
      role (confused-deputy protection, matches the Story 1.1 member trust). Passed
      through to the CodeBuild run as an environment override; not committed real.
    NoEcho: true
    MinLength: 8
    MaxLength: 128
    Default: "set-this-at-deploy-time"

  LogRetentionDays:
    Type: Number
    Description: CloudWatch Logs retention for the state-machine execution log group.
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 3653]

# ---------------------------------------------------------------------------
# RESOURCES
# ---------------------------------------------------------------------------
Resources:

  # --- Approval SNS topic ------------------------------------------------------
  # The native manual-approval paused states publish the approval request (incl. the
  # Step Functions task token) here; a human approver resumes the execution with
  # SendTaskSuccess (or fails it with SendTaskFailure). The execution role may ONLY
  # publish to THIS topic (least privilege) — not sns:* on *.
  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${NamePrefix}promotion-approval"
      # At-rest encryption (checkov CKV_AWS_26). Unlike the operational Log Group below,
      # this topic carries the Step Functions task token + the promotion decision — a
      # control-plane security channel — so it gets REAL SSE, not a justified skip. The
      # AWS-managed SNS key (alias/aws/sns) is used deliberately: it satisfies CKV_AWS_26
      # with zero key-management/rotation overhead and no per-key cost, which is the
      # right fit at this tier. Swap in a dedicated CMK here if a future requirement
      # needs key isolation, rotation control, or a cross-account key policy.
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - { Key: Project, Value: PDE }
        - { Key: Story, Value: "2.2" }
        - { Key: Component, Value: state-machine }

  # --- State-machine execution log group (own namespace, bounded retention) ---
  # KMS (CKV_AWS_158): this group holds PDE Step Functions execution telemetry
  # (state transitions + the promotion flow) in the Hub control-plane account —
  # operational control-plane logging, NOT customer, forensic, or regulated data. A
  # dedicated CMK is deliberately NOT provisioned at this tier: it adds key
  # management/rotation overhead + per-request cost with no corresponding
  # data-sensitivity need, and SSE with the CloudWatch Logs AWS-owned key already
  # encrypts the data at rest. Revisit if a future PDE flow is made to log sensitive
  # values (then provision a CMK + KmsKeyId here). Suppressed with reason:
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    # checkov:skip=CKV_AWS_158:PDE Step Functions operational logs (non-sensitive control-plane execution telemetry); SSE via the AWS-owned key suffices at this tier — a CMK is unjustified overhead (see comment above).
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${NamePrefix}promotion-pipeline"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: PDE }
        - { Key: Story, Value: "2.2" }
        - { Key: Component, Value: state-machine }

  # --- Least-privilege permissions for the state machine ----------------------
  # Start/describe/stop EXACTLY the Story 2.1 pdlv-deploy project (by its specific
  # ARN) — NOT codebuild:*, NOT a wildcard resource. This is the only "deploy"
  # power the orchestrator holds; the cross-account deploy itself is done by the
  # 2.1 CodeBuild service role (which assumes the member roles). 2.2 only STARTS it.
  StartDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${NamePrefix}sfn-start-deploy"
      Description: Start/describe/stop ONLY the specific pdlv-deploy CodeBuild project.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartSpecificDeployProjectOnly
            Effect: Allow
            Action:
              - codebuild:StartBuild
              - codebuild:StopBuild
              - codebuild:BatchGetBuilds
            Resource:
              - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${DeployProjectName}"

  # The .sync (startBuild.sync) integration uses a managed CloudWatch Events rule to
  # learn when the build completes. These are the exact actions Step Functions needs
  # for the CodeBuild .sync pattern, scoped to the AWS-managed rule name.
  #
  # LIVE-FIX (Story 2.3 validation attempt 1, 2026-10-01, Independent Validator FAIL):
  # the deploy rolled back with CreateStateMachine AccessDenied — "'...:role/
  # pdlv-promotion-pipeline-role' is not authorized to create managed-rule". At
  # CreateStateMachine time Step Functions validates it can MANAGE the EventBridge
  # rule that backs the codebuild:startBuild.sync integration. Two gaps caused the
  # denial: (1) the rule-name was scoped to the SINGLE literal
  # StepFunctionsGetEventsForCodeBuildStartBuildRule, but the service manages the rule
  # under the StepFunctionsGetEventsFor* name family — a one-literal scope is too tight
  # for the .sync validation; (2) the lifecycle actions were incomplete — managing the
  # rule needs DeleteRule + RemoveTargets as well as PutRule/PutTargets/DescribeRule.
  # FIX (still least privilege — NOT events:* and NOT Resource "*"): grant the exact
  # AWS-published managed-rule action set, scoped to the StepFunctionsGetEventsFor*
  # rule-name family in THIS account+region only. This is the AWS IAM template for the
  # .sync pattern (service-integration-iam-templates); it is bounded to the Step
  # Functions-managed rules, not arbitrary EventBridge rules.
  SyncEventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${NamePrefix}sfn-sync-events"
      Description: Manage ONLY the Step Functions-managed .sync rules (startBuild.sync).
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # LIVE-FIX (Story 2.3 attempt 6, 2026-10-02): a scoped rule-ARN resource on
          # these events actions STILL produced "not authorized to create managed-rule"
          # (AccessDenied, SDK Attempt Count 11) even after the attempt-5 DependsOn
          # ordering fix. ROOT CAUSE (corrects attempts 1 & 5): at CreateStateMachine
          # time Step Functions calls events:PutRule/PutTargets/DescribeRule to
          # provision + validate the managed rule for the codebuild:startBuild.sync
          # integration, and that authorization check does NOT accept a resource-SCOPED
          # grant — AWS's OWN published IAM template for this integration
          # (service-integration-iam-templates / codebuild-iam) grants these three
          # actions on Resource: "*". The scoping was the defect, not the ordering and
          # not the action set. FIX: grant exactly the three AWS-documented managed-rule
          # actions on Resource "*" (bounded to events: rule MANAGEMENT only — no other
          # events action, no other service). This is the accepted, documented pattern
          # for .sync integrations; the "*" is required because the managed rule's ARN
          # is not matchable at the authorization check.
          - Sid: CodeBuildSyncManagedRule
            Effect: Allow
            Action:
              - events:PutTargets
              - events:PutRule
              - events:DescribeRule
            Resource: "*"

  # Publish the approval request (with the task token) to THIS approval topic only.
  PublishApprovalPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${NamePrefix}sfn-publish-approval"
      Description: Publish the manual-approval request to the PDE approval topic only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishApprovalTopicOnly
            Effect: Allow
            Action: sns:Publish
            Resource:
              - !Ref ApprovalTopic

  # Write execution logs to THIS state machine's own log group only.
  StateMachineLogsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${NamePrefix}sfn-logs"
      Description: Deliver Step Functions execution logs to the PDE pdlv- log group only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Step Functions logging to CloudWatch Logs requires these log-DELIVERY
          # actions on Resource "*": they manage an ACCOUNT-LEVEL log delivery + the
          # account CloudWatch Logs resource-policy, not a per-log-group grant, so AWS
          # rejects a scoped ARN here. This is the AWS-documented SFN logging policy.
          #
          # LIVE-FIX (Story 2.3 attempt 7, 2026-10-02): the deploy got PAST the
          # EventBridge managed-rule hurdle (the Resource "*" events fix worked) and then
          # rolled back with "The state machine IAM Role is not authorized to access the
          # Log Destination". ROOT CAUSE: `logs:PutResourcePolicy` was in the SCOPED
          # (log-group-ARN) statement below — but PutResourcePolicy is an ACCOUNT-LEVEL
          # action (it writes the account's CloudWatch Logs resource-policy that lets
          # Step Functions attach the log destination), so a scoped ARN DENIES it. SAME
          # class as the events fix: a service log-delivery action requires Resource "*".
          # FIX: moved logs:PutResourcePolicy up into this "*" delivery statement. Only
          # the actual log-WRITE actions (CreateLogStream/PutLogEvents) stay scoped to
          # this state machine's own log-group ARN below.
          - Sid: LogDeliverySetup
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"
          - Sid: OwnStateMachineLogGroupOnly
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt StateMachineLogGroup.Arn
              - !Sub "${StateMachineLogGroup.Arn}:*"

  # --- The state-machine execution role ---------------------------------------
  # Trusted ONLY by Step Functions; attaches the four scoped managed policies above.
  # No wildcards, no account-wide admin grant.
  StateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}promotion-pipeline-role"
      Description: >-
        Least-privilege execution role for the PDE promotion state machine. Starts
        only the specific pdlv-deploy CodeBuild project, publishes the approval
        request to the PDE approval topic, and writes its own execution logs
        (RD-006). No wildcards, no admin.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StepFunctionsServiceTrust
            Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
      ManagedPolicyArns:
        - !Ref StartDeployPolicy
        - !Ref SyncEventsPolicy
        - !Ref PublishApprovalPolicy
        - !Ref StateMachineLogsPolicy
      Tags:
        - { Key: Project, Value: PDE }
        - { Key: Story, Value: "2.2" }
        - { Key: Component, Value: state-machine }
        - { Key: Model, Value: orchestrate-and-pull }
        - { Key: ManagedBy, Value: cloudformation }

  # --- The promotion state machine --------------------------------------------
  # STANDARD type: the manual-approval states pause with .waitForTaskToken, which can
  # outlast the 5-minute EXPRESS ceiling (a human approves on their own clock). The
  # definition sequences:
  #   DeployDev -> AwaitSandboxApproval (PAUSE) -> DeploySandbox
  #             -> AwaitProdApproval (PAUSE) -> DeployProd -> PromotionSucceeded
  # Each DeployX task is codebuild:startBuild.sync against the SPECIFIC pdlv-deploy
  # project, overriding TARGET_ROLE_ARN + EXTERNAL_ID for that environment's member
  # role; the deploy ACTION runs locally in the member via that assumed role (RD-006).
  # Each AwaitXApproval is sns:publish.waitForTaskToken — a NATIVE paused state, not a
  # wait/timer: the execution halts until a human SendTaskSuccess/SendTaskFailure.
  PromotionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    # LIVE-FIX (Story 2.3 attempt 5, 2026-10-01): the clean-slate deploy STILL rolled
    # back with "pdlv-promotion-pipeline-role is not authorized to create managed-rule"
    # (SDK Attempt Count: 11 — Step Functions retried PutRule through the whole window
    # and stayed denied). ROOT CAUSE was NOT the policy content (the SyncEventsPolicy
    # already grants the complete .sync managed-rule action set on the right ARN) but a
    # CloudFormation ORDERING race: `RoleArn: !GetAtt ...Role.Arn` makes the state
    # machine wait for the ROLE, but NOT for the role's MANAGED-POLICY ATTACHMENTS to
    # propagate through IAM — so CreateStateMachine fired (and immediately tried
    # events:PutRule) before SyncEventsPolicy was effective on the role, and IAM denied
    # it. FIX: an explicit DependsOn on all four managed policies forces CloudFormation
    # to finish attaching them BEFORE creating the state machine. This changes ONLY
    # resource ordering — it does not alter least privilege.
    DependsOn:
      - StartDeployPolicy
      - SyncEventsPolicy
      - PublishApprovalPolicy
      - StateMachineLogsPolicy
    Properties:
      StateMachineName: !Sub "${NamePrefix}promotion-pipeline"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineExecutionRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionSubstitutions:
        DeployProjectName: !Ref DeployProjectName
        ApprovalTopicArn: !Ref ApprovalTopic
        ExternalId: !Ref ExternalId
        DevRoleArn: !Sub "arn:${AWS::Partition}:iam::${DevAccountId}:role/${MemberRoleName}-dev"
        SandboxRoleArn: !Sub "arn:${AWS::Partition}:iam::${SandboxAccountId}:role/${MemberRoleName}-sandbox"
        ProdRoleArn: !Sub "arn:${AWS::Partition}:iam::${ProdAccountId}:role/${MemberRoleName}-prod"
      DefinitionString: |
        {
          "Comment": "PDE promotion pipeline: Dev -> (approve) -> Sandbox -> (approve) -> Prod. Each deploy starts the pdlv-deploy CodeBuild project (.sync); each approval is a native waitForTaskToken pause.",
          "StartAt": "DeployDev",
          "States": {
            "DeployDev": {
              "Type": "Task",
              "Resource": "arn:aws:states:::codebuild:startBuild.sync",
              "Parameters": {
                "ProjectName": "${DeployProjectName}",
                "EnvironmentVariablesOverride": [
                  { "Name": "TARGET_ENV", "Type": "PLAINTEXT", "Value": "dev" },
                  { "Name": "TARGET_ROLE_ARN", "Type": "PLAINTEXT", "Value": "${DevRoleArn}" },
                  { "Name": "EXTERNAL_ID", "Type": "PLAINTEXT", "Value": "${ExternalId}" }
                ]
              },
              "Next": "AwaitSandboxApproval"
            },
            "AwaitSandboxApproval": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
              "Parameters": {
                "TopicArn": "${ApprovalTopicArn}",
                "Message": {
                  "stage": "Awaiting Sandbox Approval",
                  "promoteTo": "sandbox",
                  "taskToken.$": "$$.Task.Token",
                  "executionId.$": "$$.Execution.Id"
                }
              },
              "Next": "DeploySandbox"
            },
            "DeploySandbox": {
              "Type": "Task",
              "Resource": "arn:aws:states:::codebuild:startBuild.sync",
              "Parameters": {
                "ProjectName": "${DeployProjectName}",
                "EnvironmentVariablesOverride": [
                  { "Name": "TARGET_ENV", "Type": "PLAINTEXT", "Value": "sandbox" },
                  { "Name": "TARGET_ROLE_ARN", "Type": "PLAINTEXT", "Value": "${SandboxRoleArn}" },
                  { "Name": "EXTERNAL_ID", "Type": "PLAINTEXT", "Value": "${ExternalId}" }
                ]
              },
              "Next": "AwaitProdApproval"
            },
            "AwaitProdApproval": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
              "Parameters": {
                "TopicArn": "${ApprovalTopicArn}",
                "Message": {
                  "stage": "Awaiting Prod Approval",
                  "promoteTo": "prod",
                  "taskToken.$": "$$.Task.Token",
                  "executionId.$": "$$.Execution.Id"
                }
              },
              "Next": "DeployProd"
            },
            "DeployProd": {
              "Type": "Task",
              "Resource": "arn:aws:states:::codebuild:startBuild.sync",
              "Parameters": {
                "ProjectName": "${DeployProjectName}",
                "EnvironmentVariablesOverride": [
                  { "Name": "TARGET_ENV", "Type": "PLAINTEXT", "Value": "prod" },
                  { "Name": "TARGET_ROLE_ARN", "Type": "PLAINTEXT", "Value": "${ProdRoleArn}" },
                  { "Name": "EXTERNAL_ID", "Type": "PLAINTEXT", "Value": "${ExternalId}" }
                ]
              },
              "Next": "PromotionSucceeded"
            },
            "PromotionSucceeded": {
              "Type": "Succeed"
            }
          }
        }
      Tags:
        - { Key: Project, Value: PDE }
        - { Key: Story, Value: "2.2" }
        - { Key: Component, Value: state-machine }
        - { Key: Model, Value: orchestrate-and-pull }
        - { Key: ManagedBy, Value: cloudformation }

  # ===========================================================================
  # PHASE 2 GATE PROBE (Story 2.3, attempt 9) — a SEPARATE, structurally
  # non-promoting state machine used ONLY to prove the Phase 2 gate: that the
  # manual-approval pause (sns:publish.waitForTaskToken) is reachable with no
  # IAM/config error, WITHOUT a real cross-account deploy.
  #
  # WHY SEPARATE (chosen over an in-pipeline gateMode flag, 2026-10-02): the
  # production PromotionStateMachine above carries NO bypass branch at all — there
  # is no input-driven way to skip a DeployX or an approval in the real pipeline,
  # so the gate capability adds ZERO production attack surface. The probe is
  # structurally INCAPABLE of promoting:
  #   * its ASL has NO Deploy* task and references codebuild NOWHERE — it cannot
  #     start a build or assume any member role;
  #   * it ends in a Fail terminal (GateProbeReachedPause), never Succeed — an
  #     approved probe can never report "promotion succeeded";
  #   * its role has ONLY sns:Publish to the approval topic + its own logs — no
  #     codebuild:*, no events: managed-rule (no .sync task), no sts:AssumeRole.
  # The probe is meant to reach the pause and then be ABORTED (never approved).

  # Probe role logs policy — write its own execution logs only.
  GateProbeLogsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${NamePrefix}gate-probe-logs"
      Description: Deliver the Phase 2 gate-probe execution logs to its own pdlv- log group only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LogDeliverySetup
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"
          - Sid: OwnLogGroupOnly
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt GateProbeLogGroup.Arn
              - !Sub "${GateProbeLogGroup.Arn}:*"

  # Probe role publish policy — publish ONLY to the approval topic (same topic the
  # real pipeline uses, so the pause behaviour is identical). Nothing else.
  GateProbePublishPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${NamePrefix}gate-probe-publish"
      Description: Publish the gate-probe approval request to the PDE approval topic only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishApprovalTopicOnly
            Effect: Allow
            Action: sns:Publish
            Resource:
              - !Ref ApprovalTopic

  GateProbeLogGroup:
    Type: AWS::Logs::LogGroup
    # checkov:skip=CKV_AWS_158:PDE gate-probe operational logs (non-sensitive control-plane probe telemetry); SSE via the AWS-owned key suffices at this tier — a CMK is unjustified overhead (same rationale as the state-machine log group).
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${NamePrefix}gate-probe"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: PDE }
        - { Key: Story, Value: "2.3" }
        - { Key: Component, Value: gate-probe }

  # Probe execution role — trusted only by Step Functions; ONLY publish + own logs.
  # Deliberately NO codebuild, NO events managed-rule, NO sts:AssumeRole.
  GateProbeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}gate-probe-role"
      Description: >-
        Minimal execution role for the Phase 2 gate probe. Publishes the approval
        request to the PDE approval topic and writes its own logs — nothing else.
        No codebuild, no events managed-rule, no cross-account assume.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StepFunctionsServiceTrust
            Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
      ManagedPolicyArns:
        - !Ref GateProbePublishPolicy
        - !Ref GateProbeLogsPolicy
      Tags:
        - { Key: Project, Value: PDE }
        - { Key: Story, Value: "2.3" }
        - { Key: Component, Value: gate-probe }
        - { Key: ManagedBy, Value: cloudformation }

  # The gate-probe state machine — STARTS at the approval pause, then FAILS.
  # It has exactly two states and references NO deploy/codebuild resource, so it
  # cannot promote or deploy anything. Proving it reaches AwaitSandboxApproval
  # without error IS the Phase 2 gate.
  GateProbeStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - GateProbePublishPolicy
      - GateProbeLogsPolicy
    Properties:
      StateMachineName: !Sub "${NamePrefix}gate-probe"
      StateMachineType: STANDARD
      RoleArn: !GetAtt GateProbeExecutionRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt GateProbeLogGroup.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionSubstitutions:
        ApprovalTopicArn: !Ref ApprovalTopic
      DefinitionString: |
        {
          "Comment": "PDE Phase 2 gate PROBE: prove the manual-approval pause is reachable with no IAM/config error, WITHOUT any deploy. StartAt the pause; terminate in Fail (never Succeed) so an approved probe can never read as a promotion. No Deploy/CodeBuild state exists.",
          "StartAt": "AwaitSandboxApproval",
          "States": {
            "AwaitSandboxApproval": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
              "Parameters": {
                "TopicArn": "${ApprovalTopicArn}",
                "Message": {
                  "stage": "Awaiting Sandbox Approval",
                  "probe": true,
                  "note": "PHASE 2 GATE PROBE — non-promoting; abort after confirming the pause",
                  "taskToken.$": "$$.Task.Token",
                  "executionId.$": "$$.Execution.Id"
                }
              },
              "Next": "GateProbeReachedPause"
            },
            "GateProbeReachedPause": {
              "Type": "Fail",
              "Error": "GateProbeComplete",
              "Cause": "Phase 2 gate probe reached the approval pause; it does not promote. Abort/ignore this execution."
            }
          }
        }
      Tags:
        - { Key: Project, Value: PDE }
        - { Key: Story, Value: "2.3" }
        - { Key: Component, Value: gate-probe }
        - { Key: ManagedBy, Value: cloudformation }

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
Outputs:

  PromotionStateMachineArn:
    Description: ARN of the PDE promotion state machine (Story 2.3 starts a dummy run against this).
    Value: !Ref PromotionStateMachine
    Export:
      Name: pdlv-promotion-pipeline-arn

  PromotionStateMachineName:
    Description: Name of the PDE promotion state machine.
    Value: !GetAtt PromotionStateMachine.Name
    Export:
      Name: pdlv-promotion-pipeline-name

  ApprovalTopicArn:
    Description: ARN of the SNS topic the manual-approval paused states publish to.
    Value: !Ref ApprovalTopic
    Export:
      Name: pdlv-promotion-approval-topic-arn

  StateMachineExecutionRoleArn:
    Description: ARN of the least-privilege state-machine execution role.
    Value: !GetAtt StateMachineExecutionRole.Arn
    Export:
      Name: pdlv-promotion-pipeline-role-arn

  GateProbeStateMachineArn:
    Description: ARN of the Phase 2 gate PROBE state machine (Story 2.3 starts a dummy run against THIS to prove the approval pause is reachable — it cannot deploy or promote).
    Value: !Ref GateProbeStateMachine
    Export:
      Name: pdlv-gate-probe-arn

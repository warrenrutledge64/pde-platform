name: PDE infra static bar

# No-op touch (2026-10-03): trigger a FRESH CI run on a new PR head so the latest
# check is unambiguously green — superseding a stale "Re-run jobs" of the pre-fix
# commit 7df7f91 (which legitimately fails CKV_AWS_111; the fix is on 7358608+).
#
# Checkout-proof validation (OD-007 clear-by #3; OD-008 escalation): GitHub checks
# out the EXACT PR head commit automatically, so a validator reading these logs can
# never be looking at a stale local checkout (the attempt 3-5 failure mode, where a
# human CloudShell clone kept validating the pre-fix file). This runs the SAME static
# bar an operator would run by hand — the stdlib invariant checkers + their in-memory
# --self-test, cfn-lint, and Checkov — over the PDE CloudFormation templates.
#
# This workflow does NOT deploy anything and needs NO AWS credentials — it is pure
# static analysis of infra/*.yaml. It is additive tooling (RD-015 management artifact),
# not a change to any deliverable.

on:
  pull_request:
    paths:
      - "infra/**"
      - "DOCS/session-briefs/**"
      - "governance/**"
      - "scripts/**"
      - ".github/workflows/static-bar.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  static-bar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR head (exact commit — no stale checkout possible)
        uses: actions/checkout@v4

      - name: Show the commit under test (target lock)
        run: |
          echo "HEAD commit:"
          git log --oneline -1
          echo "SNS at-rest encryption present on the approval topic (CKV_AWS_26 fix)?"
          grep -n "KmsMasterKeyId" infra/state-machine.yaml || { echo "KmsMasterKeyId ABSENT — stale/pre-fix tree"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline invariant checkers (+ in-memory self-test)
        run: |
          python3 infra/validate_trust_fabric.py
          python3 infra/validate_hub_orchestrator_role.py
          python3 infra/validate_hub_orchestrator_role.py --self-test
          python3 infra/validate_state_machine.py
          python3 infra/validate_state_machine.py --self-test
          python3 infra/validate_codebuild_projects.py
          python3 infra/validate_codebuild_projects.py --self-test
          python3 infra/validate_golden_path_artifact.py
          python3 infra/validate_golden_path_artifact.py --self-test

      # Deploy-tag guard (OD-012 — folds the Phase-2 gate FAIL into the offline
      # bar): the live-deployed pdlv-promotion-pipeline-stack lacked the mandatory
      # Project=PDE stack tag. That tag is applied by the DEPLOY COMMAND, not the
      # template (bare-resource YAML), so this guard proves every pdlv- deploy
      # invocation in the committed LIVE-RUNBOOKs carries --tags Project=PDE. It
      # cannot see live AWS (the operator's post-deploy describe-stacks VERIFY +
      # the gate's BOM reconciliation do that) — it guarantees the PROCEDURE never
      # silently drops the tag. The --self-test proves the guard is strict.
      - name: Deploy-tag guard (every pdlv- deploy carries Project=PDE)
        run: |
          python3 scripts/check_deploy_tags.py --self-test
          python3 scripts/check_deploy_tags.py

      - name: Install the static-analysis bar
        run: pip install --quiet cfn-lint checkov

      # Both the lint and the security bar grade the ACTIVE, top-level infra
      # templates only — the artifacts a story actually deploys. infra/deferred/
      # holds parked/retired templates (RD-007, picked up at Story 4.1) that are
      # explicitly not-deployed in Phases 1-3; grading them here would fail a
      # story's PR on out-of-scope code. cfn-lint already scopes to infra/*.yaml
      # (non-recursive); checkov is scoped to match with --skip-path infra/deferred
      # so the two steps are consistent. The deferred templates keep their own
      # offline invariant checkers and are re-validated at Story 4.1 when adapted
      # root-hosted -> Hub-delegated.
      - name: cfn-lint (well-formedness, incl. the E1003 Description limit)
        run: cfn-lint infra/*.yaml

      - name: Checkov (security bar — expect 0 failed; CKV_AWS_158 SKIPPED, CKV_AWS_26 fixed)
        run: checkov -d infra --framework cloudformation --skip-path infra/deferred

      # Merge-order guard (prevents the fix-after-merge trap, PDE Story 2.2 /
      # OD-008): a deliverable (infra/**) change must NOT merge into the base
      # branch while the Validation & Advancement Gate is still ARMED. This turns
      # the PR red until the story's close-out (sealed Validation Result + ✅ +
      # cleared Validation Debt entry) is on the branch head. Server-side branch
      # protection is NOT enforced on a private/free repo, so this red/green CI
      # signal + the CONTRIBUTING convention ("merge only when green") is the
      # guard. The --self-test proves the check itself is strictly enforced.
      #
      # It runs LAST and with `if: always()` ON PURPOSE: a deliverable PR
      # legitimately sits with the gate ARMED (and the guard RED) for the whole
      # time the story is in independent validation. Running the guard last means
      # the static-analysis evidence above (cfn-lint / Checkov / the offline
      # checkers) is ALWAYS produced on every PR run — so the independent
      # validator can read a green static bar on the PR head while the guard is
      # still (correctly) red — and the guard STILL fails the job (turning the PR
      # red) until the close-out disarms the gate at head. The merge-gate behaviour
      # is unchanged; only the step order is, so the gate is never the thing that
      # hides the static-bar signal.
      - name: Input-poisoning locks (validator inputs are repo-derived, not builder-asserted)
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 scripts/check_locks.py --self-test
          # need history to the base to diff; fetch the base ref unshallowed enough
          git fetch --no-tags origin "${{ github.base_ref }}"
          # HARD locks (2/3/4) fail the job; the Lock-1 advisory prints via check_docs
          python3 scripts/check_locks.py --base "origin/${{ github.base_ref }}" --head HEAD

      - name: Merge-order guard (deliverable + close-out land together)
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 scripts/check_merge_order.py --self-test
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 scripts/check_merge_order.py --base "origin/${{ github.base_ref }}"
